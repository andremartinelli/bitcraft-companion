# Production deploy: on every release published on GitHub (or by hand, in
# Actions → Release → Run workflow). Pushes don't publish to production
# (vercel.json: git.deploymentEnabled.main = false).
#
# 1. Tests: typecheck, lint and the whole suite, with a Postgres just for them.
# 2. Deploy: the migrations on Neon and the production deploy on Vercel.
#
# Repository secrets (Settings → Secrets and variables → Actions):
# - VERCEL_TOKEN: a token from the Vercel account (vercel.com/account/settings/tokens)
# - DATABASE_URL_UNPOOLED: Neon's direct URL (no -pooler in the host)
# The setup steps are kept outside this repository (owner's private notes).
# - VERCEL_ORG_ID, VERCEL_PROJECT_ID: ids of the Vercel account and project (not keys, but kept out of the public repo)
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# One production deploy at a time; a new one waits for the previous to finish
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      # Only to sign the tests' cookies; not the production key
      SESSION_SECRET: chave-dos-testes-do-ci-nao-usada-em-producao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tabelas do banco de testes
        run: npx prisma migrate deploy
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Deploy na Vercel
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Confere os segredos
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "::error::Falta o segredo VERCEL_ORG_ID."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Falta o segredo VERCEL_PROJECT_ID."; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::Falta o segredo VERCEL_TOKEN."; exit 1; }
          test -n "$DATABASE_URL_UNPOOLED" || { echo "::error::Falta o segredo DATABASE_URL_UNPOOLED."; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Before the new code: migrations only add, the live app keeps working
      - name: Migrations no Neon
        run: npx prisma migrate deploy
      - name: Deploy de produção
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
