# Testes em cada pull request e em cada push no main: typecheck, lint e a
# suíte inteira, com um Postgres só para eles. O mesmo job de testes do
# release.yml, sem nenhum segredo e sem tocar em produção.
#
# As versões daqui (Node e a imagem do Postgres) também são as do ambiente das
# sessões do Claude Code na nuvem (scripts/workspace/cloud-setup.sh lê este
# arquivo). Ao mudar uma, mude também no release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a rodada anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      # Só para assinar os cookies dos testes; não é a chave de produção
      SESSION_SECRET: chave-dos-testes-do-ci-nao-usada-em-producao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tabelas do banco de testes
        run: npx prisma migrate deploy
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
