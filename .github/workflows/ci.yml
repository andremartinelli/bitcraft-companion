# Tests on every pull request and every push to main: typecheck, lint and the
# whole suite, with a Postgres just for them. The same tests job as
# release.yml, with no secrets and without touching production.
#
# The versions here (Node and the Postgres image) are also the ones in the
# Claude Code cloud sessions' environment (scripts/workspace/cloud-setup.sh
# reads this file). When you change one, change release.yml too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      # Only to sign the tests' cookies; not the production key
      SESSION_SECRET: chave-dos-testes-do-ci-nao-usada-em-producao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tabelas do banco de testes
        run: npx prisma migrate deploy
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
