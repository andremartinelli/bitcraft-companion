# Game data import into Neon, by hand, on every game patch:
# Actions → Importar dados do jogo → Run workflow. Reads
# BitCraftToolBox/BitCraft_GameData (the latest commit, or the one given) and writes
# through Neon's direct URL. Step by step in docs/deploy.md (step 6).
#
# Repository secret: DATABASE_URL_UNPOOLED, the same as release.yml. With
# it here, no Claude session and no PC needs Neon's URL.
name: Importar dados do jogo

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit do BitCraft_GameData (vazio importa o último)
        required: false
        default: ''

# The same queue as release.yml: one waits for the other to finish
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Importação no Neon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Confere o segredo e o commit
        run: |
          test -n "$DATABASE_URL_UNPOOLED" || { echo "::error::Falta o segredo DATABASE_URL_UNPOOLED (veja docs/deploy.md)."; exit 1; }
          if [ -n "$COMMIT" ] && ! [[ "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::O commit tem de ser um SHA do BitCraft_GameData (7 a 40 caracteres hexadecimais)."
            exit 1
          fi
          # The repository is public, and so are the logs: hides Neon's address
          node -e 'const u = new URL(process.env.DATABASE_URL_UNPOOLED); console.log(`::add-mask::${u.host}`); console.log(`::add-mask::${u.hostname}`)'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The import code expects this version's tables. If Neon has a
      # pending migration, the status fails: publish a release first.
      - name: Migrations em dia no Neon
        run: npx prisma migrate status
      - name: Importação
        run: npm run game-data:import -- ${COMMIT:+--commit=$COMMIT}
