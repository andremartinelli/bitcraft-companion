# Apaga do Neon o banco de um preview (branch "preview/<branch do git>") quando
# o branch do git é apagado. A integração da Vercel com o Neon só apaga o
# banco quando o deployment é apagado, e o plano Free tem 10 branches.
# À mão (Actions → Limpar bancos dos previews → Run workflow): apaga todo
# branch preview/* do Neon cujo branch do git já não existe.
# A API do Neon não acorda o banco: a limpeza não gasta CU-horas.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
# - NEON_API_KEY: uma chave da API do Neon
# - NEON_PROJECT_ID: o id do projeto no Neon (Settings → General)
# Passo a passo em docs/deploy.md (Previews).
name: Limpar bancos dos previews

on:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Apagar branches do Neon
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      DELETED_BRANCH: ${{ github.event.ref }}
    steps:
      - name: Confere os segredos
        run: |
          test -n "$NEON_API_KEY" || { echo "::error::Falta o segredo NEON_API_KEY (veja docs/deploy.md)."; exit 1; }
          test -n "$NEON_PROJECT_ID" || { echo "::error::Falta o segredo NEON_PROJECT_ID (veja docs/deploy.md)."; exit 1; }
      - name: Apaga os branches
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          # id e nome de cada branch preview/* do Neon
          curl -fsS "${auth[@]}" "$api" \
            | jq -r '.branches[] | select(.name | startswith("preview/")) | [.id, .name] | @tsv' > neon.tsv

          if [ "$GITHUB_EVENT_NAME" = delete ]; then
            wanted=$(awk -F'\t' -v name="preview/$DELETED_BRANCH" '$2 == name' neon.tsv)
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | sed 's|^|preview/|' > git.txt
            wanted=$(awk -F'\t' 'NR == FNR { alive[$0] = 1; next } !($2 in alive)' git.txt neon.tsv)
          fi

          if [ -z "$wanted" ]; then
            echo "Nenhum branch de preview para apagar."
            exit 0
          fi
          while IFS=$'\t' read -r id name; do
            curl -fsS -X DELETE "${auth[@]}" "$api/$id" > /dev/null
            echo "Apagado do Neon: $name"
          done <<< "$wanted"
