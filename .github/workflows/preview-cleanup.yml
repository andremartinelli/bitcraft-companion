# Deletes a preview's database from Neon (branch "preview/<git branch>") when
# the git branch is deleted. The Vercel-Neon integration only deletes the
# database when the deployment is deleted, and the Free plan has 10 branches.
# By hand (Actions → Limpar bancos dos previews → Run workflow): deletes every
# preview/* branch in Neon whose git branch no longer exists.
# Neon's API doesn't wake the database: the cleanup doesn't spend CU-hours.
#
# Repository secrets (Settings → Secrets and variables → Actions):
# - NEON_API_KEY: a Neon API key
# - NEON_PROJECT_ID: the project's id in Neon (Settings → General)
# The setup steps are kept outside this repository (owner's private notes).
name: Limpar bancos dos previews

on:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Apagar branches do Neon
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      DELETED_BRANCH: ${{ github.event.ref }}
    steps:
      - name: Confere os segredos
        run: |
          test -n "$NEON_API_KEY" || { echo "::error::Falta o segredo NEON_API_KEY."; exit 1; }
          test -n "$NEON_PROJECT_ID" || { echo "::error::Falta o segredo NEON_PROJECT_ID."; exit 1; }
      - name: Apaga os branches
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          # id and name of each preview/* branch in Neon
          curl -fsS "${auth[@]}" "$api" \
            | jq -r '.branches[] | select(.name | startswith("preview/")) | [.id, .name] | @tsv' > neon.tsv

          if [ "$GITHUB_EVENT_NAME" = delete ]; then
            wanted=$(awk -F'\t' -v name="preview/$DELETED_BRANCH" '$2 == name' neon.tsv)
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | sed 's|^|preview/|' > git.txt
            wanted=$(awk -F'\t' 'NR == FNR { alive[$0] = 1; next } !($2 in alive)' git.txt neon.tsv)
          fi

          if [ -z "$wanted" ]; then
            echo "Nenhum branch de preview para apagar."
            exit 0
          fi
          while IFS=$'\t' read -r id name; do
            curl -fsS -X DELETE "${auth[@]}" "$api/$id" > /dev/null
            echo "Apagado do Neon: $name"
          done <<< "$wanted"
